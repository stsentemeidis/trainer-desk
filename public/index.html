<style>
:root{color-scheme:dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one top bar with three tabs, then a single working column (max 1120px). Lists and tables, few boxes. */
/* Enakoma: black ground, white type, one blue accent. Status colours (green, yellow, red) are the only other colour. */
:root{
  --bg:#0A0A0B; --surface:#151517; --sunken:#1F1F23; --raised:#1D1D20; --line:#2A2A2F;
  --field:#0F0F11; --field-line:#3A3A41;
  --ink:#F4F4F5; --ink-2:#B9B9C1; --ink-3:#9494A0;
  --accent:#3D7BFF; --accent-ink:#0A0A0B; --accent-soft:#111C36; --link:#6F9DFF;
  --good:#4ADE9A; --good-soft:#0F2F22; --warn:#FFD166; --warn-soft:#3A2F0B; --bad:#FF7A70; --bad-soft:#3D1917;
  --bar:#0A0A0B; --bar-ink:#F4F4F5; --bar-ink-2:#9A9AA3; --shade:rgba(0,0,0,.72);
  --display:"Manrope","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:8px;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* top bar */
.top{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:20px;display:grid;grid-template-columns:minmax(max-content,1fr) minmax(0,auto) minmax(max-content,1fr);align-items:center;gap:8px 24px}
.topright{justify-self:end;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;padding-block:15px;min-width:0;color:var(--bar-ink)}
.brand svg{display:block;height:30px;width:auto;max-width:100%}
.tabs{display:flex;gap:8px;min-width:0;justify-content:center}
.tab{background:none;border:0;color:var(--bar-ink-2);padding:18px 14px 15px;border-bottom:3px solid transparent;cursor:pointer;font-weight:500}
.tab:hover{color:var(--bar-ink)}
.tab[aria-current="page"]{color:var(--bar-ink);border-bottom-color:var(--accent)}
.top .btn{background:transparent;border-color:rgba(163,175,188,.45);color:var(--bar-ink)}

.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:24px 64px;display:flex;flex-direction:column;gap:28px}
.banner{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.banner-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner-in p{flex:1;min-width:220px}

/* headings */
.h{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.h1{font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:-.035em;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere;margin-bottom:6px}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.hint{color:var(--ink-3);font-size:13.5px;max-width:65ch;overflow-wrap:anywhere}
a{color:var(--link)}
.row{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* figures */
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.fig{padding:14px 16px 12px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig + .fig{padding-left:16px;border-left:1px solid var(--line)}
.fig b{font-weight:800;font-size:36px;line-height:1.1;letter-spacing:-.02em}
.fig small{color:var(--ink-3);font-size:13px}
.figs.three{grid-template-columns:repeat(3,minmax(0,1fr))}

/* buttons */
.btn{background:var(--raised);border:1px solid var(--field-line);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13.5px}
.btn.quiet{background:none;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--sunken)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{width:30px;height:30px;padding:0;display:inline-grid;place-items:center;font-size:16px;line-height:1}
.link{background:none;border:0;padding:0;color:var(--link);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* pills carry state in a dot + word, not colour alone */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--ink-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* client list */
.clist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chead,.crow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,2.2fr) minmax(120px,auto);gap:16px;align-items:center;padding:12px 16px}
.chead{background:var(--sunken);padding-block:8px}
.crow{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);cursor:pointer}
.crow:hover{background:var(--accent-soft)}
.crow .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.crow .sub{color:var(--ink-3);font-size:13px;overflow-wrap:anywhere}
.only-narrow,.crow .only-narrow{display:none}
.crow .bal{justify-self:end}
.goalcell{display:flex;flex-direction:column;gap:5px;min-width:0}
.goalcell span{font-size:13px;color:var(--ink-2)}
.meter{display:block;height:8px;border-radius:4px;background:var(--sunken);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.meter.big{height:12px;border-radius:6px;overflow:visible}
.meter.big i{border-radius:6px}
.meter.big u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2)}

/* tables */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.t{border-collapse:collapse;width:100%}
.t th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 12px;background:var(--sunken);white-space:nowrap}
.t td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.t .n{text-align:right}
.t tfoot td{font-weight:600;border-top:2px solid var(--ink)}
.t .muted{color:var(--ink-3)}
.t.prog{min-width:820px}
.t.prog td{padding:6px 8px}
.t.wide{min-width:640px}

/* form controls */
input[type=text],input[type=number],input[type=date],input[type=email],input[type=time],input[type=search],select,textarea{background:var(--field);border:1px solid var(--field-line);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
input:hover,select:hover,textarea:hover{border-color:var(--ink-3)}
.t.prog input,.t.prog select{border-color:transparent;background:transparent}
.t.prog input:hover,.t.prog select:hover,.t.prog input:focus,.t.prog select:focus{border-color:var(--field-line);background:var(--field)}
input.w-s{width:64px}input.w-m{width:96px}input.w-l{width:130px}
.c-ex{min-width:210px}.c-note{min-width:180px}.c-act{white-space:nowrap}
.tabs{overflow-x:auto}
.exfilter{align-items:flex-end}
.exfilter .field:not(.grow){width:230px}
.exfilter .grow{max-width:420px}
.range{align-items:flex-end}
.range .icon{width:38px;height:38px}
.range .field{width:170px}
.range .quick{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:38px}
.dayhead{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:8px;margin:6px 0 -10px}
.dayhead span{color:var(--ink-3);font-weight:500;letter-spacing:.04em;margin-left:10px}
.clshead input[type=date]{width:164px}
.clshead .times{display:inline-flex;align-items:center;gap:8px;color:var(--ink-3)}
.clshead input[type=time]{width:140px}
.clshead .clsbtns{display:inline-flex;gap:4px;align-items:center}
.cls > input[type=text]{max-width:640px}
.stepper{display:inline-flex;gap:6px;align-items:center}
.btn,.tab,.subtab,.crow,.link{touch-action:manipulation}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;z-index:1}
.matrix td:first-child{background:var(--surface)}
input.num{text-align:right}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:end}
.err{color:var(--bad);font-size:14px;font-weight:500}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:auto}

/* client view */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.day{display:flex;flex-direction:column;gap:8px}
.dayname{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;border-color:transparent!important;background:transparent!important;padding:2px 6px;margin-left:-6px;max-width:460px}
.dayname:hover,.dayname:focus{border-color:var(--field-line)!important;background:var(--field)!important}
.addrow select{max-width:280px}
.goal{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px 20px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:2px solid var(--ink)}
.goal .ttl{font-weight:600;font-size:16px}
.goal .scale{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-top:6px}
.goal .scale b{color:var(--ink);font-weight:600}
.goal .side{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

/* charts */
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-size:11.5px;font-family:var(--body)}
.chart .val{fill:var(--ink);font-size:12.5px;font-weight:600;font-family:var(--body)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.18}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .bar{fill:var(--accent)}
.chart .bar.dim{opacity:.55}
.chart .goal-line{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.chart .goal-dot{fill:var(--surface);stroke:var(--ink-2);stroke-width:2}
.chart .cross{stroke:var(--ink-3);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:4px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.tip b{font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
details.values summary{cursor:pointer;color:var(--ink-2);font-size:13.5px;width:max-content}

/* modal, toast, empty */
.modal-back{position:fixed;inset:0;background:var(--shade);display:grid;place-items:start center;padding:6vh 16px 16px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:10px;padding:22px;width:min(560px,100%);display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal.wide{width:min(680px,100%)}
.modal form{display:flex;flex-direction:column;gap:14px}
.copybox{display:flex;gap:8px;align-items:flex-start}
.copybox > :first-child{flex:1;min-width:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{color:var(--ink-2);max-width:60ch}

@media (max-width:760px){
  .top-in{padding-inline:16px;display:flex;flex-wrap:wrap}.wrap{padding-inline:16px}.banner-in{padding-inline:16px}
  .brand{padding-block:14px 2px;flex-basis:100%}
  .brand svg{height:26px}
  .tab{padding:10px 10px 9px}
  .h1{font-size:30px}
  .row > .title{flex-basis:100%}
  .figs,.figs.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fig:nth-child(odd){padding-left:0;border-left:0}
  .fig:nth-child(n+3){border-top:1px solid var(--line)}
  .fig b{font-size:28px}
  .chead{display:none}
  .crow{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}
  .crow .only-wide{display:none}.crow .only-narrow{display:block}
  .crow .goalcell{grid-column:1 / -1;grid-row:2}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .goal{grid-template-columns:minmax(0,1fr)}
  .goal .side{justify-content:flex-start}
  /* phone: larger type and touch targets */
  body{font-size:16px}
  input[type=text],input[type=number],input[type=date],input[type=email],input[type=time],input[type=search],select,textarea{font-size:16px;min-height:44px}
  .btn{min-height:44px}
  .btn.small{min-height:38px}
  .icon{width:44px;height:44px;font-size:18px}
  .check input{width:22px;height:22px;min-height:0}
  .only-wide{display:none}.only-narrow{display:inline}
  .brand{order:1;flex:1 1 auto!important}
  .topright{order:2}
  .tabs{order:4;flex-basis:100%;gap:0;justify-content:flex-start}
  .tab{flex:1;text-align:center;padding-inline:4px}
  .clshead .grow{flex-basis:100%}
  .clshead input[type=date]{flex:1 1 100%}
  .exfilter .field{flex:1 1 100%!important;width:auto!important;max-width:none!important}
  .range .field{flex:1 1 40%;width:auto;min-width:0}
  .range .icon{order:2;width:44px;height:44px}
  .range .quick{order:3;flex:1;justify-content:flex-end}
  .clshead .times{flex:1 1 100%}
  .clshead .times input[type=time]{flex:1;width:auto;min-width:0}
  .clshead .clsbtns{margin-left:auto}
  .subtabs{overflow:visible;gap:0}
  .subtab{flex:1;text-align:center;padding:13px 2px}
  .tools .grow{flex-basis:100%}.tools .btn{flex:1}
  .dayname{font-size:18px;min-height:0!important}
  .grid2.keep{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal-back{padding:12px}
  .modal{padding:18px}
  .modal form > .row .btn{flex:1}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .savebar{position:sticky;bottom:0;z-index:3;background:var(--bg);border-top:1px solid var(--line);margin-inline:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .savebar .btn{width:100%}
  /* phone: table rows become cards, so nothing needs sideways scrolling */
  .cardwrap{overflow:visible;background:none;border:0;border-radius:0}
  .t.cards{display:block;min-width:0}
  .t.cards thead{display:none}
  .t.cards tbody{display:flex;flex-direction:column;gap:10px}
  .t.cards tr{display:grid;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);align-items:end}
  .t.cards td{display:block;padding:0;border:0;min-width:0;text-align:left}
  .t.cards td:empty{display:none}
  .t.cards td[colspan]{grid-column:1 / -1}
  .t.cards td[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px}
  .t.cards td.inl[data-l]::before{display:inline;margin:0 6px 0 0}
  .t.cards input,.t.cards select{width:100%}
  .t.prog.cards tr{grid-template-columns:1fr 1.25fr 1.15fr 1.15fr}
  .t.prog.cards .c-ex,.t.prog.cards .c-note,.t.prog.cards .c-act{grid-column:1 / -1}
  .t.prog.cards .c-ex select{font-weight:600}
  .t.prog.cards .c-act{display:flex;justify-content:flex-end;gap:4px;margin-top:-4px}
  .t.prog.cards input,.t.prog.cards select{border-color:var(--field-line);background:var(--field)}
  .t.prog.cards input.num,.t.log.cards input.num{text-align:left}
  .t.log.cards tr{grid-template-columns:1fr 1fr}
  .t.log.cards .c-name{grid-column:1 / -1;font-size:17px}
  .t.log.cards .c-plan{grid-column:1 / -1;margin-top:-8px;font-size:14px}
  .t.log.cards .c-plan::before{content:"Plan "}
  .t.log.cards .c-load{grid-column:1 / -1}
  .t.log.cards .stepper{display:flex;gap:8px}
  .t.log.cards .stepper input{flex:1;text-align:center;font-weight:600;font-size:18px}
  .t.log.cards .stepper .btn{width:56px;height:44px;font-size:22px}
  .t.hist.cards tr,.t.ledger.cards tr,.t.owes.cards tr{grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:6px 12px}
  .t.hist.cards td:nth-child(1){grid-area:1 / 1;font-weight:600}
  .t.hist.cards td:nth-child(4){grid-area:1 / 2;text-align:right}
  .t.hist.cards td:nth-child(2){grid-area:2 / 1 / 3 / 3}
  .t.hist.cards td:nth-child(3){grid-area:3 / 1 / 4 / 3;font-size:14px}
  .t.hist.cards td:nth-child(5){grid-area:4 / 1 / 5 / 3;text-align:right}
  .t.ledger.cards td:nth-child(2){grid-area:1 / 1;font-weight:600}
  .t.ledger.cards td:nth-child(3),.t.ledger.cards td:nth-child(4){grid-area:1 / 2;text-align:right;font-weight:600}
  .t.ledger.cards td:nth-child(1){grid-area:2 / 1;color:var(--ink-3)}

/* ---------- money and goals (pure) ---------- */
function stats(c){
  let charged = 0, paid = 0, lastPayment = null;
  const charges = [];
  (c.ledger || []).forEach(e => {
    if (e.type === 'charge') { charged += e.amount; charges.push(e); }
    else { paid += e.amount; if (!lastPayment || e.date > lastPayment) lastPayment = e.date; }
  });
  charges.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  let pool = paid, oldest = null;
  for (const e of charges) { if (pool >= e.amount - 0.005) pool -= e.amount; else { oldest = e.date; break; } }
  return {charged:r2(charged), paid:r2(paid), balance:r2(charged - paid), oldest, lastPayment};
}
function received(clients){
  const byClient = {}, totals = {};
  clients.forEach(c => { byClient[c.id] = {}; (c.ledger || []).forEach(e => { if (e.type !== 'payment') return; const ym = e.date.slice(0, 7);
    byClient[c.id][ym] = r2((byClient[c.id][ym] || 0) + e.amount); totals[ym] = r2((totals[ym] || 0) + e.amount); }); });
  return {byClient, totals};
}
function monthsBack(n, from){
  const out = []; const d = D((from || today()).slice(0, 7) + '-15');
  for (let i = 0; i < n; i++) { out.unshift(d.getFullYear() + '-' + pad(d.getMonth() + 1)); d.setMonth(d.getMonth() - 1); }
  return out;
}
function liftSeries(c, ex){
  return (c.sessions || []).slice().sort((a, b) => a.date < b.date ? -1 : 1).map(s => {
    const v = s.entries.filter(e => e.ex === ex && e.load != null && e.load !== '').map(e => +e.load);
    return v.length ? {x:s.date, y:Math.max.apply(null, v)} : null;
  }).filter(Boolean);
}
const weightSeries = c => (c.weights || []).slice().sort((a, b) => a.date < b.date ? -1 : 1).map(w => ({x:w.date, y:+w.kg}));
function goalState(c, g){
  let current = g.start;
  if (g.type === 'lift') { const p = liftSeries(c, g.ex).filter(p => p.x >= g.from); if (p.length) current = g.target >= g.start ? Math.max.apply(null, p.map(p => p.y)) : p[p.length - 1].y; }
  else if (g.type === 'weight') { const w = weightSeries(c); if (w.length) current = w[w.length - 1].y; }
  else if (g.current != null) current = g.current;
  const span = g.target - g.start;
  const p = span === 0 ? 1 : clamp((current - g.start) / span, 0, 1);
  const total = days(g.from, g.by), t = today();
  const tf = total > 0 ? clamp(days(g.from, t) / total, 0, 1) : 1;
  const status = p >= 1 ? 'reached' : t > g.by ? 'overdue' : p >= tf - 0.12 ? 'ontrack' : 'behind';
  return {current, p, tf, status};
}
const STATUS = {reached:['good','Reached'], ontrack:['good','On track'], behind:['warn','Behind plan'], overdue:['bad','Past deadline']};
function balancePill(c){
  const st = stats(c);
  if (st.balance > 0.005) { const late = st.oldest && days(st.oldest, today()) > 30; return '<span class="pill ' + (late ? 'bad' : 'warn') + '">Owes ' + money(st.balance) + '</span>'; }
  if (st.balance < -0.005) return '<span class="pill">' + money(-st.balance) + ' in credit</span>';
  return '<span class="pill good">Settled</span>';
}
const target = it => it.sets + ' × ' + it.reps + (it.load != null && it.load !== '' ? ' @ ' + fnum(it.load) + ' kg' : '');

    if (c.note) { const lines = doc.splitTextToSize(c.note, W - 2 * M); y += 15; doc.setFont(body, 'normal'); doc.setFontSize(10); doc.setTextColor.apply(doc, INK2); doc.text(lines, M, y); y += (lines.length - 1) * 12; }

      styles:{font:body, fontStyle:'normal', fontSize:9.5, textColor:INK, cellPadding:{top:6, bottom:6, left:8, right:8}, valign:'middle', overflow:'linebreak', lineWidth:0},
      headStyles:{fillColor:HEAD, textColor:[255,255,255], font:body, fontStyle:'bold', fontSize:8.5}, alternateRowStyles:{fillColor:SOFT},
      columnStyles:{0:{cellWidth:26, halign:'right', textColor:INK2}, 1:{cellWidth:138, fontStyle:'bold'}, 2:{cellWidth:62}, 3:{cellWidth:54}, 4:{cellWidth:84}, 5:{cellWidth:50}, 6:{cellWidth:'auto', textColor:INK2}},

/* ---------- charts ---------- */
function ticks(min, max, n){
  const span = (max - min) || 1, raw = span / (n || 4), mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 1e6; v += step) t.push(+v.toFixed(6));
  return t;
}
function drawCharts(){
  Object.keys(chartData).forEach(id => { const el = $(id); if (!el) return; const w = el.clientWidth; if (!w) return;
    if (chartData[id].kind === 'line') drawLine(el, chartData[id], w); else drawBars(el, chartData[id], w); });
}
function tipFor(el){ let t = el.querySelector('.tip'); if (!t) { t = document.createElement('div'); t.className = 'tip'; t.hidden = true; el.appendChild(t); } return t; }

  const ys = pts.map(p => p.y).concat(d.goal ? [d.goal.y] : []);

  const X = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r), Y = v => m.t + (1 - (v - y0) / ((y1 - y0) || 1)) * (H - m.t - m.b);

  tk.forEach(v => { s += '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="axis" x="' + (m.l - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + fnum(v) + '</text>'; });

      '<text class="axis" x="' + gx + '" y="' + (gy - 11) + '" text-anchor="end">Goal ' + fnum(d.goal.y) + ' ' + d.unit + ' by ' + fmtShort(d.goal.by) + '</text>'; }

  s += '<line class="cross" y1="' + m.t + '" y2="' + (H - m.b) + '" x1="0" x2="0" visibility="hidden"/><circle class="dot" r="5" cx="' + lx + '" cy="' + ly + '"/>';
  const near = d.goal && Math.abs(ly - Y(d.goal.y)) < 26 && lx > X(+D(d.goal.by)) - 190;

function drawBars(el, d, W){
  const pts = d.pts, H = W < 480 ? 200 : 240, m = {l:48, r:12, t:26, b:28};

      const kg = num(dr.weight); if (kg && kg > 0) c.weights = c.weights.filter(w => w.date !== dr.date).concat([{date:dr.date, kg:r2(kg)}]);
      if (dr.sync) s.entries.forEach(e => { const it = day.items.find(i => i.ex === e.ex); if (it && e.load != null) it.load = e.load; });
      saveClient(c); ui.draft = null; toast(fee > 0 ? 'Session saved and ' + money(fee) + ' charged' : 'Session saved'); break; }
    case 'delsession': c.sessions = c.sessions.filter(s => s.id !== d.id); c.ledger = c.ledger.filter(e => e.sessionId !== d.id); ui.draft = null; saveClient(c); toast('Session and its charge deleted'); break;
    case 'delgoal': c.goals = c.goals.filter(g => g.id !== d.id); saveClient(c); break;
    case 'delledger': c.ledger = c.ledger.filter(e => e.id !== d.id); saveClient(c); break;
    case 'delex': delete S.exercises[d.id]; saveExercises(); break;
    default: return;
  }
  render();
}

let toastT = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }
function copy(src, btn){
  const done = () => { const old = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = old; }, 1400); };
  const select = () => { src.focus(); src.select(); toast('Selected. Press Ctrl or Cmd + C to copy.'); };
  if (!src.value) return toast('There is nothing to copy yet.');
  try { navigator.clipboard.writeText(src.value).then(done, select); } catch (e) { select(); }
}

/* ---------- files ---------- */
function saveFile(filename, data, type){
  const blob = data instanceof Blob ? data : new Blob([data], {type:type || 'application/octet-stream'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Downloaded ' + filename);
}
function exportCsv(){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"', rows = [['Date','Client','Type','Description','Paid by','Amount','Currency']];
  clientList().forEach(c => c.ledger.forEach(e => rows.push([e.date, c.name, e.type === 'payment' ? 'Payment' : 'Charge', e.note || '', e.method || '', e.amount, S.settings.currency])));
  rows.sort((a, b) => a[0] === 'Date' ? -1 : b[0] === 'Date' ? 1 : a[0] < b[0] ? -1 : 1);
  saveFile('Charges and payments ' + today() + '.csv', '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
function pdfFonts(){ if (!window.PDF_FONTS) throw new Error('fonts'); return window.PDF_FONTS; }
async function buildPdf(c){
  const doc = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
  let body = 'helvetica', disp = 'helvetica';
  try { pdfFonts().forEach(f => { doc.addFileToVFS(f[0], f[1]); doc.addFont(f[0], f[2], f[3]); }); body = 'Body'; disp = 'Body'; } catch (e) {}
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 42, s = S.settings;
  const INK = [10,10,11], INK2 = [84,84,94], LINE = [214,216,222], ACC = [61,123,255], ACCT = [36,88,214], SOFT = [243,244,247];
  doc.setFillColor.apply(doc, INK); doc.rect(0, 0, W, 76, 'F'); doc.setFillColor.apply(doc, ACC); doc.rect(0, 76, W, 4, 'F');
  let drawn = false; try { if (window.BRAND && BRAND.logo) { doc.addImage(BRAND.logo, 'PNG', M, 22, 32 * BRAND.ratio, 32); drawn = true; } } catch (e) {}
  if (!drawn) { doc.setFont(disp, 'bold'); doc.setFontSize(24); doc.setTextColor(255, 255, 255); doc.text('enakoma', M, 48); }
  doc.setFont(body, 'normal'); doc.setFontSize(9.5); doc.setTextColor(200, 200, 208);
  const side = [s.trainer, s.contact].filter(Boolean); side.forEach((t, i) => doc.text(t, W - M, (side.length > 1 ? 36 : 44) + i * 14, {align:'right'}));
  let y = 116;
  doc.setFont(body, 'bold'); doc.setFontSize(8.5); doc.setTextColor.apply(doc, ACCT); doc.text('TRAINING PROGRAM', M, y, {charSpace:1.2});
  y += 32; doc.setFont(disp, 'bold'); doc.setFontSize(30); doc.setTextColor.apply(doc, INK); doc.text(c.name, M, y);
  y += 20; doc.setFont(body, 'normal'); doc.setFontSize(10); doc.setTextColor.apply(doc, INK2);
  doc.text('Issued ' + fmtDate(today()) + '   ·   ' + c.days.length + (c.days.length === 1 ? ' training day' : ' training days') + '   ·   Loads in kg', M, y);
  y += 34;
  const right = t => ({content:t, styles:{halign:'right'}});
  const table = (head, rows, cols) => { doc.autoTable({startY:y + 9, margin:{left:M, right:M, bottom:56, top:M + 6}, head:[head], body:rows, theme:'plain', rowPageBreak:'avoid',
    styles:{font:body, fontStyle:'normal', fontSize:9.5, textColor:INK, cellPadding:{top:6.5, bottom:6.5, left:8, right:8}, valign:'middle', overflow:'linebreak', lineWidth:0},
    headStyles:{fillColor:INK, textColor:[255,255,255], font:body, fontStyle:'bold', fontSize:8.5}, alternateRowStyles:{fillColor:SOFT}, columnStyles:cols,
    didParseCell:d => { if (d.section === 'head') d.cell.styles.textColor = [255,255,255]; }}); y = doc.lastAutoTable.finalY + 30; };
  const title = (t, rows) => { if (y + Math.min(40 + rows * 26, 170) > H - 60) { doc.addPage(); y = M + 18; }
    doc.setFont(disp, 'bold'); doc.setFontSize(15); doc.setTextColor.apply(doc, INK); doc.text(t, M, y); };
  c.days.forEach(d => {
    title(d.name, d.items.length);
    table([right('#'), 'Exercise', right('Sets'), 'Reps', right('Load'), 'Rest', 'Notes'],
      d.items.map((it, i) => [i + 1, exName(it.ex), it.sets, it.reps, it.load != null && it.load !== '' ? fnum(it.load) + ' kg' : 'Body', it.rest || '', it.note || '']),
      {0:{cellWidth:26, halign:'right', textColor:INK2}, 1:{cellWidth:150, fontStyle:'bold'}, 2:{cellWidth:40, halign:'right'}, 3:{cellWidth:84}, 4:{cellWidth:56, halign:'right'}, 5:{cellWidth:54}, 6:{cellWidth:'auto', textColor:INK2}});
  });
  if (c.goals.length) {
    title('Your goals', c.goals.length);
    table(['Goal', right('Started at'), right('Now'), right('Target'), 'Reach it by'],
      c.goals.map(g => { const gs = goalState(c, g); return [g.label, fnum(g.start) + ' ' + g.unit, fnum(gs.current) + ' ' + g.unit, fnum(g.target) + ' ' + g.unit, fmtDate(g.by)]; }),
      {0:{cellWidth:'auto', fontStyle:'bold'}, 1:{cellWidth:80, halign:'right'}, 2:{cellWidth:80, halign:'right'}, 3:{cellWidth:80, halign:'right'}, 4:{cellWidth:100}});
  }
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) { doc.setPage(p); doc.setDrawColor.apply(doc, LINE); doc.setLineWidth(0.75); doc.line(M, H - 40, W - M, H - 40);
    doc.setFont(body, 'normal'); doc.setFontSize(8.5); doc.setTextColor.apply(doc, INK2);
    doc.text([s.business || 'Enakoma', c.name].filter(Boolean).join('  ·  '), M, H - 26); doc.text('Page ' + p + ' of ' + pages, W - M, H - 26, {align:'right'}); }
  return doc.output('arraybuffer');
}
async function exportPdf(c, btn){
  if (!c) return;
  if (!window.jspdf) return toast('The PDF tool did not load. Reload the page and try again.');
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing…';
  try { const buf = await buildPdf(c); saveFile('Program - ' + c.name + ' - ' + today() + '.pdf', new Blob([buf], {type:'application/pdf'})); }
  catch (e) { toast('The PDF could not be created.'); }
  btn.disabled = false; btn.textContent = old;
}

boot();
})();
