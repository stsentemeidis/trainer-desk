<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Trainer Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111A23'/%3E%3Cg fill='%2386A4FF'%3E%3Crect x='4' y='10' width='4' height='12' rx='1'/%3E%3Crect x='24' y='10' width='4' height='12' rx='1'/%3E%3Crect x='8' y='14.5' width='16' height='3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=Sofia+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one dark bar with three tabs, then a single working column (max 1120px). Lists and tables, few boxes. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --sunken:#E7EBF0; --line:#D5DBE2;
  --ink:#111A23; --ink-2:#465361; --ink-3:#66727F;
  --accent:#1E50D6; --accent-ink:#FFFFFF; --accent-soft:#E2E9FC;
  --good:#146C43; --good-soft:#DCF1E5; --warn:#8F4E00; --warn-soft:#FAE9CC; --bad:#AD241C; --bad-soft:#FADFDC;
  --bar:#111A23; --bar-ink:#F1F3F6; --bar-ink-2:#A3AFBC; --shade:rgba(17,26,35,.45);
  --display:"Sofia Sans Extra Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Commissioner","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#151C24; --sunken:#0A0E12; --line:#28333F;
  --ink:#E9EEF3; --ink-2:#AAB6C2; --ink-3:#8492A0;
  --accent:#86A4FF; --accent-ink:#0B1226; --accent-soft:#1A2646;
  --good:#62D49B; --good-soft:#11301F; --warn:#F1B55F; --warn-soft:#38290F; --bad:#FF8E84; --bad-soft:#3D1917;
  --bar:#080B0F; --bar-ink:#E9EEF3; --bar-ink-2:#8492A0; --shade:rgba(0,0,0,.6);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C24; --sunken:#0A0E12; --line:#28333F;
  --ink:#E9EEF3; --ink-2:#AAB6C2; --ink-3:#8492A0;
  --accent:#86A4FF; --accent-ink:#0B1226; --accent-soft:#1A2646;
  --good:#62D49B; --good-soft:#11301F; --warn:#F1B55F; --warn-soft:#38290F; --bad:#FF8E84; --bad-soft:#3D1917;
  --bar:#080B0F; --bar-ink:#E9EEF3; --bar-ink-2:#8492A0; --shade:rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* top bar */
.top{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1120px;margin:0 auto;padding-inline:20px;display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;line-height:1;padding-block:14px;min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;flex:1;min-width:0}
.tab{background:none;border:0;color:var(--bar-ink-2);padding:16px 12px 13px;border-bottom:3px solid transparent;cursor:pointer;font-weight:500}
.tab:hover{color:var(--bar-ink)}
.tab[aria-current="page"]{color:var(--bar-ink);border-bottom-color:var(--accent)}
.top .btn{background:transparent;border-color:rgba(163,175,188,.45);color:var(--bar-ink)}

.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:24px 64px;display:flex;flex-direction:column;gap:28px}
.banner{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.banner-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner-in p{flex:1;min-width:220px}

/* headings */
.h{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.h1{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:.01em;line-height:1;text-wrap:balance;overflow-wrap:anywhere}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.hint{color:var(--ink-3);font-size:13.5px;max-width:65ch;overflow-wrap:anywhere}
a{color:var(--accent)}
.row{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* figures */
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.fig{padding:14px 16px 12px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig + .fig{padding-left:16px;border-left:1px solid var(--line)}
.fig b{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;letter-spacing:.01em}
.fig small{color:var(--ink-3);font-size:13px}
.figs.three{grid-template-columns:repeat(3,minmax(0,1fr))}

/* buttons */
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13.5px}
.btn.quiet{background:none;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--sunken)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{width:30px;height:30px;padding:0;display:inline-grid;place-items:center;font-size:16px;line-height:1}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* pills carry state in a dot + word, not colour alone */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--ink-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* client list */
.clist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chead,.crow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,2.2fr) minmax(120px,auto);gap:16px;align-items:center;padding:12px 16px}
.chead{background:var(--sunken);padding-block:8px}
.crow{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);cursor:pointer}
.crow:hover{background:var(--accent-soft)}
.crow .nm{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.crow .sub{color:var(--ink-3);font-size:13px;overflow-wrap:anywhere}
.crow .only-narrow{display:none}
.crow .bal{justify-self:end}
.goalcell{display:flex;flex-direction:column;gap:5px;min-width:0}
.goalcell span{font-size:13px;color:var(--ink-2)}
.meter{display:block;height:8px;border-radius:4px;background:var(--sunken);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.meter.big{height:12px;border-radius:6px;overflow:visible}
.meter.big i{border-radius:6px}
.meter.big u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2)}

/* tables */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.t{border-collapse:collapse;width:100%}
.t th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 12px;background:var(--sunken);white-space:nowrap}
.t td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.t .n{text-align:right}
.t tfoot td{font-weight:600;border-top:2px solid var(--ink)}
.t .muted{color:var(--ink-3)}
.t.prog{min-width:820px}
.t.prog td{padding:6px 8px}
.t.wide{min-width:640px}

/* form controls */
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
input:hover,select:hover,textarea:hover{border-color:var(--ink-3)}
.t.prog input,.t.prog select{border-color:transparent;background:transparent}
.t.prog input:hover,.t.prog select:hover,.t.prog input:focus,.t.prog select:focus{border-color:var(--line);background:var(--surface)}
input.w-s{width:64px}input.w-m{width:96px}input.w-l{width:130px}
input.num{text-align:right}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.err{color:var(--bad);font-size:14px;font-weight:500}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:auto}

/* client view */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.day{display:flex;flex-direction:column;gap:8px}
.dayname{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;border-color:transparent!important;background:transparent!important;padding:2px 6px;margin-left:-6px;max-width:460px}
.dayname:hover,.dayname:focus{border-color:var(--line)!important;background:var(--surface)!important}
.addrow select{max-width:280px}
.goal{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px 20px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:2px solid var(--ink)}
.goal .ttl{font-weight:600;font-size:16px}
.goal .scale{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-top:6px}
.goal .scale b{color:var(--ink);font-weight:600}
.goal .side{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

/* charts */
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-size:11.5px;font-family:var(--body)}
.chart .val{fill:var(--ink);font-size:12.5px;font-weight:600;font-family:var(--body)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.1}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .bar{fill:var(--accent)}
.chart .bar.dim{opacity:.55}
.chart .goal-line{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.chart .goal-dot{fill:var(--surface);stroke:var(--ink-2);stroke-width:2}
.chart .cross{stroke:var(--ink-3);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:4px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.tip b{font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
details.values summary{cursor:pointer;color:var(--ink-2);font-size:13.5px;width:max-content}

/* modal, toast, empty */
.modal-back{position:fixed;inset:0;background:var(--shade);display:grid;place-items:start center;padding:6vh 16px 16px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:10px;padding:22px;width:min(560px,100%);display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal.wide{width:min(680px,100%)}
.modal form{display:flex;flex-direction:column;gap:14px}
.copybox{display:flex;gap:8px;align-items:flex-start}
.copybox > :first-child{flex:1;min-width:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{color:var(--ink-2);max-width:60ch}

@media (max-width:760px){
  .top-in{padding-inline:16px}.wrap{padding-inline:16px}.banner-in{padding-inline:16px}
  .brand{font-size:24px;padding-block:12px 0;flex-basis:100%}
  .tab{padding:10px 10px 9px}
  .h1{font-size:38px}
  .row > .title{flex-basis:100%}
  .figs,.figs.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fig:nth-child(odd){padding-left:0;border-left:0}
  .fig:nth-child(n+3){border-top:1px solid var(--line)}
  .fig b{font-size:36px}
  .chead{display:none}
  .crow{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}
  .crow .only-wide{display:none}.crow .only-narrow{display:block}
  .crow .goalcell{grid-column:1 / -1;grid-row:2}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .goal{grid-template-columns:minmax(0,1fr)}
  .goal .side{justify-content:flex-start}
}
@media (prefers-reduced-motion:no-preference){ .btn,.crow,.tab,.subtab{transition:background-color .12s,border-color .12s,color .12s} }
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<div id="banner"></div>
<main class="wrap" id="view"></main>
<div id="modal"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="vendor/pdf-fonts.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const D = s => new Date(s + 'T12:00:00');
const fmtDate = s => s ? D(s).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const fmtShort = s => s ? D(s).toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : '';
const fmtMonth = ym => D(ym + '-15').toLocaleDateString('en-GB', {month:'short', year:'2-digit'});
const monthName = ym => D(ym + '-15').toLocaleDateString('en-GB', {month:'long'});
const days = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r2 = n => Math.round(n * 100) / 100;
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fnum = n => (n == null || n === '') ? '' : String(r2(+n));
const sum = a => a.reduce((t, n) => t + n, 0);
function money(n){
  n = r2(n || 0);
  try { return new Intl.NumberFormat('en-GB', {style:'currency', currency:S.settings.currency || 'EUR', minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits:2}).format(n); }
  catch (e) { return n + ' ' + (S.settings.currency || ''); }
}

/* ---------- state ---------- */
const GROUPS = ['Legs','Chest','Back','Shoulders','Arms','Core','Conditioning','Other'];
const METHODS = ['Bank transfer','Cash','Card','Mobile payment','Other'];
const DEFAULTS = {business:'', trainer:'', contact:'', currency:'EUR', defaultRate:60};
const S = {ready:false, storageOk:true, canSave:true, settings:Object.assign({}, DEFAULTS), exercises:{}, clients:{}};
const ui = {tab:'clients', cid:null, sub:'program', armed:null, draft:null, metric:null, allSessions:false, modal:null};
const chartData = {};

const norm = c => Object.assign({name:'', email:'', since:today(), rate:0, notes:'', days:[], goals:[], weights:[], sessions:[], ledger:[]}, c);
const clientList = () => Object.values(S.clients).sort((a, b) => a.name.localeCompare(b.name));
const cur = () => S.clients[ui.cid] || null;
const exName = id => (S.exercises[id] && S.exercises[id].name) || 'Removed exercise';

/* ---------- storage: this browser, this device ---------- */
const KEY = 'trainer-desk:v1', BKEY = 'trainer-desk:last-backup';
const DEFAULT_EX = {"squat": {"name": "Back squat", "group": "Legs"}, "rdl": {"name": "Romanian deadlift", "group": "Legs"}, "legpress": {"name": "Leg press", "group": "Legs"}, "lunge": {"name": "Walking lunge", "group": "Legs"}, "hipthrust": {"name": "Hip thrust", "group": "Legs"}, "bench": {"name": "Bench press", "group": "Chest"}, "incdb": {"name": "Incline dumbbell press", "group": "Chest"}, "pushup": {"name": "Push-up", "group": "Chest"}, "ohp": {"name": "Overhead press", "group": "Shoulders"}, "latraise": {"name": "Lateral raise", "group": "Shoulders"}, "pulldown": {"name": "Lat pulldown", "group": "Back"}, "row": {"name": "Seated cable row", "group": "Back"}, "dbrow": {"name": "One-arm dumbbell row", "group": "Back"}, "deadlift": {"name": "Deadlift", "group": "Back"}, "curl": {"name": "Biceps curl", "group": "Arms"}, "triceps": {"name": "Triceps pushdown", "group": "Arms"}, "plank": {"name": "Plank", "group": "Core"}, "deadbug": {"name": "Dead bug", "group": "Core"}, "pallof": {"name": "Pallof press", "group": "Core"}, "bike": {"name": "Bike intervals", "group": "Conditioning"}};
const snapshot = () => ({app:'trainer-desk', v:1, settings:S.settings, exercises:S.exercises, clients:S.clients});
function adopt(d){
  S.settings = Object.assign({}, DEFAULTS, d.settings || {}); S.exercises = d.exercises || {}; S.clients = {};
  Object.keys(d.clients || {}).forEach(id => { S.clients[id] = norm(Object.assign({}, d.clients[id], {id})); });
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(snapshot())); if (!S.storageOk) { S.storageOk = true; schedule(); } }
  catch (e) { S.storageOk = false; schedule(); toast('This browser could not save that change.'); }
}
const saveClient = persist, saveSettings = persist, saveExercises = persist;
function lastBackup(){ try { return localStorage.getItem(BKEY) || ''; } catch (e) { return ''; } }
function boot(){
  const h = (location.hash || '').slice(1);
  if (['clients','payments','exercises'].includes(h)) ui.tab = h;
  let raw = null, ok = false; S.storageOk = true;
  try { raw = localStorage.getItem(KEY); } catch (e) { S.storageOk = false; }
  if (raw) { try { adopt(JSON.parse(raw)); ok = true; } catch (e) {} }
  if (!ok) S.exercises = clone(DEFAULT_EX);
  S.ready = true; render();
  window.addEventListener('storage', e => { if (e.key !== KEY || !e.newValue) return; try { adopt(JSON.parse(e.newValue)); ui.draft = null; if (!ui.modal) render(); } catch (err) {} });
}
function loadExamples(){
  const done = () => { const ex = window.TRAINER_EXAMPLES; if (!ex) return toast('The example file could not be loaded.');
    Object.keys(ex.exercises).forEach(id => { if (!S.exercises[id]) S.exercises[id] = clone(ex.exercises[id]); });
    ex.clients.forEach(c => { S.clients[c.id] = norm(clone(c)); }); persist(); toast('Example clients loaded'); render(); };
  if (window.TRAINER_EXAMPLES) return done();
  const s = document.createElement('script'); s.src = 'data/examples.js'; s.onload = done; s.onerror = () => toast('The example file could not be loaded.'); document.head.appendChild(s);
}

/* ---------- money and goals (pure) ---------- */
function stats(c){
  let charged = 0, paid = 0, lastPayment = null;
  const charges = [];
  (c.ledger || []).forEach(e => {
    if (e.type === 'charge') { charged += e.amount; charges.push(e); }
    else { paid += e.amount; if (!lastPayment || e.date > lastPayment) lastPayment = e.date; }
  });

/* ---------- charts ---------- */
function ticks(min, max, n){
  const span = (max - min) || 1, raw = span / (n || 4), mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 1e6; v += step) t.push(+v.toFixed(6));
  return t;
}
function drawCharts(){
  Object.keys(chartData).forEach(id => { const el = $(id); if (!el) return; const w = el.clientWidth; if (!w) return;
    if (chartData[id].kind === 'line') drawLine(el, chartData[id], w); else drawBars(el, chartData[id], w); });
}
function tipFor(el){ let t = el.querySelector('.tip'); if (!t) { t = document.createElement('div'); t.className = 'tip'; t.hidden = true; el.appendChild(t); } return t; }
function drawLine(el, d, W){
  const pts = d.pts; if (!pts.length) { el.innerHTML = '<p class="hint">Nothing logged yet.</p>'; return; }
  const H = W < 480 ? 220 : 280, m = {l:40, r:d.goal ? 22 : 54, t:26, b:30};
  const t0 = +D(pts[0].x), tLast = +D(pts[pts.length - 1].x);
  let t1 = d.goal ? Math.max(tLast, +D(d.goal.by)) : tLast; if (t1 === t0) t1 = t0 + 864e5;
  const ys = pts.map(p => p.y).concat(d.goal ? [d.goal.y] : []);
  const tk = ticks(Math.min.apply(null, ys), Math.max.apply(null, ys), 4), y0 = tk[0], y1 = tk[tk.length - 1];
  const X = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r), Y = v => m.t + (1 - (v - y0) / ((y1 - y0) || 1)) * (H - m.t - m.b);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">';
  tk.forEach(v => { s += '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="axis" x="' + (m.l - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + fnum(v) + '</text>'; });
  const a = new Date(t0), b = new Date(t1), marks = []; const c = new Date(a.getFullYear(), a.getMonth() + 1, 1, 12);
  while (c <= b) { marks.push(+c); c.setMonth(c.getMonth() + 1); }
  const every = Math.ceil(marks.length / Math.max(2, Math.floor((W - m.l - m.r) / 70)));
  marks.forEach((t, i) => { if (i % every) return; s += '<text class="axis" x="' + X(t) + '" y="' + (H - 8) + '" text-anchor="middle">' + new Date(t).toLocaleDateString('en-GB', {month:'short'}) + '</text>'; });
  if (!marks.length) s += '<text class="axis" x="' + m.l + '" y="' + (H - 8) + '">' + fmtShort(pts[0].x) + '</text><text class="axis" x="' + (W - m.r) + '" y="' + (H - 8) + '" text-anchor="end">' + fmtShort(iso(b)) + '</text>';
  if (d.goal) { const gx = X(+D(d.goal.by)), gy = Y(d.goal.y);
    s += '<line class="goal-line" x1="' + m.l + '" x2="' + gx + '" y1="' + gy + '" y2="' + gy + '"/><circle class="goal-dot" cx="' + gx + '" cy="' + gy + '" r="5"/>' +
      '<text class="axis" x="' + gx + '" y="' + (gy - 11) + '" text-anchor="end">Goal ' + fnum(d.goal.y) + ' ' + d.unit + ' by ' + fmtShort(d.goal.by) + '</text>'; }
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(+D(p.x)).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const last = pts[pts.length - 1], lx = X(+D(last.x)), ly = Y(last.y);
  s += '<path class="area" d="' + path + ' L' + lx.toFixed(1) + ' ' + (H - m.b) + ' L' + m.l + ' ' + (H - m.b) + ' Z"/><path class="line" d="' + path + '"/>';
  s += '<line class="cross" y1="' + m.t + '" y2="' + (H - m.b) + '" x1="0" x2="0" visibility="hidden"/><circle class="dot" r="5" cx="' + lx + '" cy="' + ly + '"/>';
  const near = d.goal && Math.abs(ly - Y(d.goal.y)) < 26 && lx > X(+D(d.goal.by)) - 190;
  s += '<text class="val" x="' + (lx + 9) + '" y="' + (ly + (near ? 18 : 4)) + '"' + (lx + 60 > W ? ' text-anchor="end" dx="-18" dy="-14"' : '') + '>' + fnum(last.y) + ' ' + d.unit + '</text></svg>';
  el.innerHTML = s;
  const svg = el.querySelector('svg'), cross = svg.querySelector('.cross'), dot = svg.querySelector('.dot'), tip = tipFor(el);
  const move = ev => { const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * (W / r.width); let best = pts[0], bd = Infinity;
    pts.forEach(p => { const dx = Math.abs(X(+D(p.x)) - x); if (dx < bd) { bd = dx; best = p; } });
    const px = X(+D(best.x)), py = Y(best.y);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible'); dot.setAttribute('cx', px); dot.setAttribute('cy', py);
    tip.innerHTML = '<b>' + fnum(best.y) + ' ' + d.unit + '</b> · ' + fmtDate(best.x); tip.hidden = false;
    tip.style.left = clamp(px * r.width / W, 70, r.width - 70) + 'px'; tip.style.top = (py * r.height / H - 12) + 'px'; };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('cx', lx); dot.setAttribute('cy', ly); });
}
function drawBars(el, d, W){
  const pts = d.pts, H = W < 480 ? 200 : 240, m = {l:48, r:12, t:26, b:28};
  const tk = ticks(0, Math.max(1, Math.max.apply(null, pts.map(p => p.y))), 4), y1 = tk[tk.length - 1];
  const band = (W - m.l - m.r) / pts.length, bw = Math.min(46, band - 2), Y = v => m.t + (1 - v / y1) * (H - m.t - m.b), base = H - m.b;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">';
  tk.forEach(v => { s += '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="axis" x="' + (m.l - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + (v >= 1000 ? fnum(v / 1000) + 'k' : fnum(v)) + '</text>'; });
  const skip = Math.ceil(pts.length / Math.max(2, Math.floor((W - m.l - m.r) / 52)));
  pts.forEach((p, i) => { const x = m.l + band * i + (band - bw) / 2, y = Y(p.y), h = base - y, r = Math.min(4, h, bw / 2), lastOne = i === pts.length - 1;
    if (h > 0) s += '<path class="bar' + (lastOne ? '' : ' dim') + '" d="M' + x + ' ' + base + ' V' + (y + r) + ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + ' H' + (x + bw - r) + ' Q' + (x + bw) + ' ' + y + ' ' + (x + bw) + ' ' + (y + r) + ' V' + base + ' Z"/>';
    if (lastOne) s += '<text class="val" x="' + (x + bw / 2) + '" y="' + (y - 7) + '" text-anchor="middle">' + money(p.y) + '</text>';
    if ((pts.length - 1 - i) % skip === 0) s += '<text class="axis" x="' + (x + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + fmtMonth(p.x) + '</text>';
    s += '<rect data-i="' + i + '" x="' + (m.l + band * i) + '" y="' + m.t + '" width="' + band + '" height="' + (base - m.t) + '" fill="transparent"/>'; });
  el.innerHTML = s + '</svg>';
  const svg = el.querySelector('svg'), tip = tipFor(el);
  const move = ev => { const i = ev.target.getAttribute && ev.target.getAttribute('data-i'); if (i == null) { tip.hidden = true; return; } const p = pts[+i], r = svg.getBoundingClientRect();
    tip.innerHTML = '<b>' + money(p.y) + '</b> · ' + monthName(p.x) + ' ' + p.x.slice(0, 4); tip.hidden = false;
    tip.style.left = clamp((m.l + band * (+i + .5)) * r.width / W, 70, r.width - 70) + 'px'; tip.style.top = (Y(p.y) * r.height / H - 10) + 'px'; };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', () => { tip.hidden = true; });
}

function act(name, d, el){
  const c = cur();

    case 'back': ui.cid = null; break;

    case 'allsessions': ui.allSessions = !ui.allSessions; break;
    case 'settings': return openModal({type:'settings'});
    case 'm-client': return openModal({type:'client', cid:d.id || null});
    case 'm-payment': case 'm-charge': return openModal({type:name.slice(2), cid:d.id || ui.cid});
    case 'm-weight': case 'm-goal': case 'm-email': return openModal({type:name.slice(2), cid:ui.cid});
    case 'm-exercise': return openModal({type:'exercise'});
    case 'close': return closeModal();
    case 'loadexamples': return loadExamples();

      try { localStorage.setItem(BKEY, today()); } catch (e) {} break;
    case 'restore-go': if (!ui.restore) return; adopt(ui.restore); ui.restore = null; persist(); ui.cid = null; ui.draft = null; ui.modal = null; renderModal(); toast('Backup restored'); break;
    case 'copy': return copy($(d.from), el);
    case 'pdf': return exportPdf(S.clients[(ui.modal && ui.modal.cid) || ui.cid], el);
    case 'csv': return exportCsv(el);
    case 'delclient': if (el.dataset.step !== '2') { el.dataset.step = '2'; el.textContent = 'Confirm delete'; el.classList.add('armed'); return; }
      delete S.clients[d.id]; persist(); ui.cid = null; ui.modal = null; renderModal(); toast('Client deleted'); break;
    case 'rmexamples': Object.values(S.clients).filter(x => x.example).forEach(x => { delete S.clients[x.id]; }); persist(); ui.cid = null; toast('Examples removed'); break;
    case 'addday': c.days.push({id:uid(), name:'Day ' + String.fromCharCode(65 + c.days.length % 26), items:[]}); ui.draft = null; saveClient(c); break;
    case 'delday': c.days = c.days.filter(x => x.id !== d.day); ui.draft = null; saveClient(c); break;
    case 'delitem': { const day = c.days.find(x => x.id === d.day); day.items = day.items.filter(i => i.id !== d.item); ui.draft = null; saveClient(c); break; }
    case 'move': { const day = c.days.find(x => x.id === d.day), i = day.items.findIndex(x => x.id === d.item), j = i + (+d.dir); if (j < 0 || j >= day.items.length) return;
      const t = day.items[i]; day.items[i] = day.items[j]; day.items[j] = t; ui.draft = null; saveClient(c); break; }
    case 'savesession': { const dr = ui.draft, day = c.days.find(x => x.id === dr.dayId); if (!dr.date) return toast('Pick a date for the session.'); if (!day) return;
      const s = {id:uid(), date:dr.date, dayId:day.id, dayName:day.name, note:(dr.note || '').trim(), entries:dr.entries.map(e => ({ex:e.ex, sets:e.sets == null ? 0 : e.sets, reps:String(e.reps == null ? '' : e.reps).trim(), load:e.load == null || e.load === '' ? null : +e.load}))};
      c.sessions.push(s); const fee = num(dr.fee);

      const kg = num(dr.weight); if (kg && kg > 0) c.weights = c.weights.filter(w => w.date !== dr.date).concat([{date:dr.date, kg:r2(kg)}]);
      if (dr.sync) s.entries.forEach(e => { const it = day.items.find(i => i.ex === e.ex); if (it && e.load != null) it.load = e.load; });

    case 'delsession': c.sessions = c.sessions.filter(s => s.id !== d.id); c.ledger = c.ledger.filter(e => e.sessionId !== d.id); ui.draft = null; saveClient(c); toast('Session and its charge deleted'); break;

function pdfFonts(){ if (!window.PDF_FONTS) throw new Error('fonts'); return window.PDF_FONTS; }

      {0:{cellWidth:26, halign:'right', textColor:INK2}, 1:{cellWidth:150, fontStyle:'bold'}, 2:{cellWidth:40, halign:'right'}, 3:{cellWidth:84}, 4:{cellWidth:56, halign:'right'}, 5:{cellWidth:54}, 6:{cellWidth:'auto', textColor:INK2}});

async function exportPdf(c, btn){
  if (!c) return;
  if (!window.jspdf) return toast('The PDF tool did not load. Reload the page and try again.');
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing…';
  try { const buf = await buildPdf(c); saveFile('Program - ' + c.name + ' - ' + today() + '.pdf', new Blob([buf], {type:'application/pdf'})); }
  catch (e) { toast('The PDF could not be created.'); }
  btn.disabled = false; btn.textContent = old;
}

boot();
})();
</script>
